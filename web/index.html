<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @theme inline {
    --color-background: var(--ai-bg);
    --color-foreground: var(--ai-ink);
    --color-card: var(--ai-surface);
    --color-card-foreground: var(--ai-ink);
    --color-popover: var(--ai-surface);
    --color-popover-foreground: var(--ai-ink);
    --color-primary: var(--ai-brand);
    --color-primary-foreground: var(--ai-brand-ink);
    --color-secondary: var(--ai-surface-2);
    --color-secondary-foreground: var(--ai-ink);
    --color-muted: var(--ai-surface-2);
    --color-muted-foreground: var(--ai-ink-2);
    --color-accent: var(--ai-surface-2);
    --color-accent-foreground: var(--ai-ink);
    --color-destructive: var(--ai-error);
    --color-border: var(--ai-border);
    --color-input: var(--ai-border);
    --color-ring: var(--ai-brand);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
  }
  :root {
    /* === 浅色主题 token(Linear / shadcn 风格) === */
    --ai-bg: #FAFAFB;
    --ai-surface: #FFFFFF;
    --ai-surface-2: #F4F4F5;
    --ai-surface-3: #E4E4E7;
    --ai-surface-neutral: #F4F4F5;
    --ai-surface-neutral-foreground: #18181B;
    --ai-ink: #18181B;
    --ai-ink-2: #71717A;
    --ai-ink-3: #A1A1AA;
    --ai-border: rgba(24, 24, 27, 0.08);
    --ai-border-strong: rgba(24, 24, 27, 0.14);
    --ai-input: rgba(24, 24, 27, 0.06);
    --ai-brand: #3B82F6;
    --ai-brand-soft: #EFF6FF;
    --ai-brand-2: #2563EB;
    --ai-brand-ink: #FFFFFF;
    --ai-error: #DC2626;
    --ai-error-soft: #FEF2F2;
    --ai-success: #059669;
    --ai-success-soft: #ECFDF5;
    --ai-warning: #D97706;
    --ai-shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.04), 0 1px 1px rgba(24, 24, 27, 0.03);
    --ai-shadow-md: 0 4px 12px -2px rgba(24, 24, 27, 0.08), 0 2px 4px -1px rgba(24, 24, 27, 0.04);
    --ai-shadow-lg: 0 12px 32px -8px rgba(24, 24, 27, 0.12), 0 4px 12px -4px rgba(24, 24, 27, 0.06);
    --ai-shadow-brand: 0 4px 14px -2px color-mix(in srgb, var(--ai-brand) 22%, transparent);
    --text: var(--ai-ink);
    --text-muted: var(--ai-ink-2);
    --text-tertiary: var(--ai-ink-3);
    --border: var(--ai-border);
    --brand: var(--ai-brand);
    --brand-ink: var(--ai-brand-ink);
    --font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background-color: var(--ai-bg);
    color: var(--ai-ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: antialiased;
  }

  /* === 整体背景:浅灰底 === */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: transparent;
  }
  #app { position: relative; z-index: 1; height: 100%; }

  /* === Glow / float / pulse 工具类(浅色版) === */
  .ai-glow { box-shadow: var(--ai-shadow-brand); }
  .ai-glow-soft { box-shadow: 0 0 32px -8px color-mix(in srgb, var(--ai-brand) 14%, transparent); }
  .ai-avatar-ring {
    box-shadow: 0 0 0 3px var(--ai-surface), 0 0 0 5px color-mix(in srgb, var(--ai-brand) 22%, transparent);
  }
  .ai-card-shadow { box-shadow: var(--ai-shadow-sm); }
  .ai-card-hover {
    transition: border-color 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s cubic-bezier(.2,.8,.2,1), transform 0.2s cubic-bezier(.2,.8,.2,1);
  }
  .ai-card-hover:hover {
    border-color: color-mix(in srgb, var(--ai-brand) 35%, var(--ai-border-strong));
    box-shadow: var(--ai-shadow-md);
    transform: translateY(-1px);
  }
  @keyframes ai-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .ai-float { animation: ai-float 4s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes ai-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.92); } }
  .ai-pulse { animation: ai-pulse 2.2s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes typingBounce { 0%, 80%, 100% { transform: scale(.6); opacity: .35; } 40% { transform: scale(1); opacity: 1; } }
  .typing-dots span { animation: typingBounce 1.4s ease-in-out infinite both; }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

  /* === 消息气泡 === */
  .bubble-user {
    background: var(--ai-surface);
    border: 1px solid var(--ai-border);
    box-shadow: var(--ai-shadow-sm);
  }
  .bubble-ai {
    background: transparent;
    border: 1px solid transparent;
  }
  .bubble-ai.streaming::after {
    content: '▍';
    color: var(--ai-brand);
    animation: ai-pulse 1s ease-in-out infinite;
    margin-left: 2px;
    font-weight: 500;
  }

  /* === Scrollbar(浅色版) === */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(24, 24, 27, 0.12);
    border-radius: 999px;
    border: 2px solid var(--ai-bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(24, 24, 27, 0.22); }

  /* === Markdown 内容适配浅色 === */
  .bubble-md { color: var(--ai-ink); }
  .bubble-md p { margin: 0 0 10px; line-height: 1.7; }
  .bubble-md p:last-child { margin-bottom: 0; }
  .bubble-md h1, .bubble-md h2, .bubble-md h3 { margin: 14px 0 8px; line-height: 1.35; font-weight: 600; color: var(--ai-ink); }
  .bubble-md h1 { font-size: 1.3em; }
  .bubble-md h2 { font-size: 1.15em; }
  .bubble-md h3 { font-size: 1.05em; }
  .bubble-md ul, .bubble-md ol { margin: 0 0 10px; padding-left: 20px; }
  .bubble-md li { margin-bottom: 4px; line-height: 1.7; }
  .bubble-md li::marker { color: var(--ai-ink-3); }
  .bubble-md code {
    background: var(--ai-brand-soft);
    color: var(--ai-brand);
    padding: 2px 6px;
    border-radius: 5px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.88em;
    font-weight: 500;
  }
  .bubble-md pre {
    background: #1E1E2E;
    color: #E4E4E7;
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 10px 0;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    box-shadow: var(--ai-shadow-sm);
  }
  .bubble-md pre code { background: none; color: inherit; padding: 0; font-weight: 400; }
  .bubble-md blockquote {
    border-left: 3px solid var(--ai-brand);
    padding: 6px 14px;
    margin: 10px 0;
    color: var(--ai-ink-2);
    background: var(--ai-brand-soft);
    border-radius: 0 8px 8px 0;
  }
  .bubble-md a {
    color: var(--ai-brand);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--ai-brand) 30%, transparent);
    transition: border-color .15s;
  }
  .bubble-md a:hover { border-bottom-color: var(--ai-brand); }
  .bubble-md table {
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    border: 1px solid var(--ai-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .bubble-md th, .bubble-md td {
    border: 1px solid var(--ai-border);
    padding: 8px 12px;
  }
  .bubble-md th {
    background: var(--ai-surface-2);
    font-weight: 600;
    text-align: left;
  }
  .bubble-md hr {
    border: none;
    border-top: 1px solid var(--ai-border);
    margin: 14px 0;
  }
  .bubble-md strong { color: var(--ai-ink); font-weight: 600; }
  .bubble-md em { color: var(--ai-ink-2); }

  /* === 工具调用卡片 === */
  .tool-call-card {
    background: var(--ai-brand-soft);
    border: 1px solid color-mix(in srgb, var(--ai-brand) 18%, var(--ai-border));
    border-radius: 12px;
    padding: 12px 14px;
  }

  /* === 细节:hover 时头像图标旋转之类 === */
  .ai-icon-rotate-on-hover { transition: transform .2s ease; }
  .ai-icon-rotate-on-hover:hover { transform: rotate(12deg); }

  /* === 文本选中颜色 === */
  ::selection {
    background: color-mix(in srgb, var(--ai-brand) 18%, transparent);
    color: var(--ai-ink);
  }

  /* === 减少动画偏好 === */
  @media (prefers-reduced-motion: reduce) {
    .ai-float, .ai-pulse, .typing-dots span { animation: none; }
    .ai-card-hover { transition: none; }
  }

  [data-icon] { display: inline-flex; vertical-align: middle; }

  /* 防止 .msg 节点的 animation 踩坑:静态 opacity 锁死 1 */
  .msg-msg { opacity: 1 !important; }
</style>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="font-sans antialiased">
<div id="app"></div>
<script src="/web/app.js?v=ds-rd15"></script>
</body>
</html>
