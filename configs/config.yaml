server:
  port: 8080
  mode: debug
  jwt_secret: ""
  cors_origin: "*"

llm:
  provider: deepseek
  api_key: ""
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.7
  max_tokens: 4096
  timeout: 60s

mysql:
  master:
    host: 127.0.0.1
    port: 3306
    user: root
    password: ""
    database: ai_agent
    max_open_conns: 25
    max_idle_conns: 10
    conn_max_lifetime: 5m
  slave:
    host: 127.0.0.1
    port: 3306
    user: root
    password: ""
    database: ai_agent
    max_open_conns: 25
    max_idle_conns: 10
    conn_max_lifetime: 5m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  max_retries: 3
  pool_size: 10

milvus:
  address: localhost:19530
  username: ""
  password: ""
  dbname: default
  collection: embeddings
  text_max_length: 65535
  
memory:
  type: mysql  # memory | mysql | redis
  ttl: 30m
  max_messages: 100

  # L1 task state machine (per-session working memory).
  task:
    backend: memory   # memory | redis (redis is Phase 2)
    idle_ttl: 5m      # session idle window before the summary scan triggers

  # L2 long-term memory. Set enabled=false to fully disable and match mainline behavior.
  longterm:
    enabled: true
    router: true          # deterministic query router gating fact/semantic recall
    budget_ratio: 0.2     # fraction of the base prompt spent on enrichment
    extraction_model: ""  # model for the LLM extractor + idle summarizer (empty → base model)
    llm_extract: false    # enable the LLM memory extractor (needs extraction_model); off → deterministic-only
    fact:
      enabled: true
      top_k: 5
      min_score: 0.5
    policy:
      enabled: true
      top_k: 5
      min_score: 0.5
    vector:               # semantic channel; backend=memory works with no external deps
      enabled: false
      backend: memory     # memory | milvus (milvus falls back to memory until implemented)
      embedding_model: "" # embeddings model; empty → text-embedding-3-small
      embedding_dim: 1536 # used only by the hash-embedder fallback
      top_k: 5
      min_similarity: 0.7
    scoring:              # recall weight = confidence*0.3 + freshness*0.2 + relevance*0.5
      confidence: 0.3
      freshness: 0.2
      relevance: 0.5
      semantic: 1.0       # weight for vector cosine score in the semantic re-rank
    admission:
      write_threshold: 0.6
      max_entries_per_user: 1000
      max_extractions_per_session: 1

  # L2 evolution jobs (decay / cleanup).
  evolution:
    enabled: true
    decay_factor: 0.95
    idle_scan_cron: "*/1 * * * *"
    cleanup_cron: "0 3 * * *"

agent:
  max_iterations: 5            # Max ReAct loop iterations per request (1-10)
  tool_timeout: 30s            # Single tool execution timeout
  max_output_length: 4096      # Max tool output chars (truncated if exceeded)
  parallel_tool_calls: true    # Allow parallel tool execution
  max_context_messages: 50     # Max history messages in context window

log:
  level: info         # debug | info | warn | error
  format: json     # console for dev; json in prod
  output: stdout      # stdout | file
  filename: logs/app.log
  max_size: 100       # MB before rotation
  max_backups: 7      # rotated files to retain
  max_age: 30         # days to retain rotated files
  compress: false     # gzip rotated files
